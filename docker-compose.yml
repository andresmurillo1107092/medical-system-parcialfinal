services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: medical_appointments
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - medical_network

  backend:
    build: ./backend
    image: andresmurillo20/medical-system-parcialfinal:backend
    container_name: medical_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      - DB_HOST=db
      - DB_NAME=medical_appointments
      - NOTIFICATION_SERVICE_URL=http://notification_service:8001
    depends_on:
      db:
        condition: service_healthy
    networks:
      - medical_network

  notification_service:
    build: ./notification_service
    image: andresmurillo20/medical-system-parcialfinal:notification-service
    container_name: notification_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - medical_network

volumes:
  mysql_data:

networks:
  medical_network:
    driver: bridge