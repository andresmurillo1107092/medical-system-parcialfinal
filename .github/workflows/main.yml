name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Construir backend
        run: docker build -t medical-backend:ci ./backend
      - name: Construir servicio de notificaciones
        run: docker build -t notification-service:ci ./notification_service
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Construir interfaz web
        working-directory: frontend
        run: npm ci && npm run build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
      - name: Avisar si faltan secretos
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: echo "::warning::Configura DOCKERHUB_USERNAME y DOCKERHUB_TOKEN para publicar imágenes."
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
      - name: Autenticarse en Docker Hub
        uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Publicar backend
        uses: docker/build-push-action@v6
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/medical-system-parcialfinal:backend
            ${{ env.DOCKERHUB_USERNAME }}/medical-system-parcialfinal:backend-${{ github.sha }}
      - name: Publicar servicio de notificaciones
        uses: docker/build-push-action@v6
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          context: ./notification_service
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/medical-system-parcialfinal:notification-service
            ${{ env.DOCKERHUB_USERNAME }}/medical-system-parcialfinal:notification-service-${{ github.sha }}